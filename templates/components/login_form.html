<div class="login-card" style="max-width: 500px;">
    <div class="login-icon">
        <i class="fa-solid fa-mosque"></i>
    </div>
    <h1 style="margin-bottom: 5px;">منصة أثر التعليمية</h1>
    <p class="subtitle">نظام إدارة الدورات المتكامل</p>

    <!-- Login Section -->
    <div id="login-section">
        <div class="role-tabs"
            style="display: flex; gap: 10px; background: #f1f1f1; padding: 5px; border-radius: 10px; margin-bottom: 20px;">
            <button type="button" class="role-btn active" onclick="switchTab('login')"
                style="flex: 1; border: none; background: white; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--primary-green);">تسجيل
                الدخول</button>
            <button type="button" class="role-btn" onclick="switchTab('register')"
                style="flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px; cursor: pointer; color: #777;">إنشاء
                حساب</button>
        </div>

        <form id="login-form" onsubmit="window.app.login(event)">
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="username" placeholder="أدخل البريد الإلكتروني" required
                        autocomplete="username" />
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required
                        autocomplete="current-password" />
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-login">
                دخول <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
            <button type="button" class="btn-google" onclick="window.app.loginWithGoogle()"
                style="width:100%; margin-top:10px; background:white; color:#757575; border:1px solid #ddd; padding:10px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; font-weight:bold;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
                الدخول عبر جوجل
            </button>
        </form>
    </div>

    <!-- Register Section -->
    <div id="register-section" style="display: none;">
        <div class="role-tabs"
            style="display: flex; gap: 10px; background: #f1f1f1; padding: 5px; border-radius: 10px; margin-bottom: 20px;">
            <button type="button" class="role-btn" onclick="switchTab('login')"
                style="flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px; cursor: pointer; color: #777;">تسجيل
                الدخول</button>
            <button type="button" class="role-btn active" onclick="switchTab('register')"
                style="flex: 1; border: none; background: white; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; color: var(--primary-green);">إنشاء
                حساب</button>
        </div>

        <form id="register-form" onsubmit="window.app.register(event)">
            <div class="role-selection" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">نوع الحساب:</label>
                <select id="selected-role"
                    style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                    <option value="followup_supervisor">مشرف متابعة</option>
                    <option value="group_supervisor">مشرف مجموعة</option>
                </select>
            </div>

            <div class="input-group">
                <label>الاسم الكامل</label>
                <div class="input-wrapper">
                    <input type="text" id="reg-name" placeholder="أدخل اسمك الكامل" required />
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="reg-email" placeholder="أدخل البريد الإلكتروني" required
                        autocomplete="username" />
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="reg-password" placeholder="أدخل كلمة المرور" required
                        autocomplete="new-password" />
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-login" style="background: var(--primary-green);">
                إنشاء الحساب <i class="fa-solid fa-user-plus"></i>
            </button>
            <button type="button" class="btn-google" onclick="window.app.registerWithGoogle()"
                style="width:100%; margin-top:10px; background:white; color:#757575; border:1px solid #ddd; padding:10px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; font-weight:bold;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
                إنشاء حساب بجوجل
            </button>
        </form>
    </div>

    <div class="copyright">© 2026 جميع الحقوق محفوظة لمنصة أثر</div>
</div>

<!-- Group Setup View -->
<div id="group-setup-view" class="login-card" style="display: none; max-width: 500px;">
    <div class="login-icon"><i class="fa-solid fa-users-gear"></i></div>
    <h2>إعداد المجموعة</h2>
    <p class="subtitle">يرجى إنشاء مجموعة جديدة أو الانضمام لمجموعة موجودة</p>

    <div id="create-group-section" style="display: none;">
        <div class="input-group">
            <label>اسم المجموعة</label>
            <input type="text" id="new-group-name" placeholder="مثال: مجموعة الرحمة" />
        </div>
        <div class="input-group">
            <label>رقم المجموعة</label>
            <input type="text" id="new-group-number" placeholder="مثال: 101" />
        </div>
        <div class="input-group">
            <label>عدد المحاضرات في الدورة</label>
            <input type="number" id="new-group-lectures" placeholder="مثال: 12" min="1" />
        </div>
        <button class="btn-login" onclick="window.app.createGroup()">إنشاء مجموعة</button>
    </div>

    <div id="join-group-section" style="display: none;">
        <div class="input-group">
            <label>كود المجموعة</label>
            <input type="text" id="join-group-id" placeholder="أدخل الكود (مثال: GRP-ABC123)" />
        </div>
        <button class="btn-login" onclick="window.app.joinGroup()">انضمام للمجموعة</button>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.getElementById('login-section').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('register-section').style.display = tab === 'register' ? 'block' : 'none';
    }
</script>
